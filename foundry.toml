[profile.default]
src = "contracts"
out = "contracts/out"
libs = ["node_modules", "lib"]
test = "contracts/test"
script = "contracts/script"
evm_version = "paris"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"
]
